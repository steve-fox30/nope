<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINI GAME</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #050505 url("fox.webp") center/cover fixed no-repeat;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Lapisan gelap */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            z-index: 0;
        }

        /* =========================
           EMOT JATUH
        ========================= */

        .falling-symbol {
            position: fixed;
            top: -50px;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: fall linear forwards;
            user-select: none;
            filter: drop-shadow(0 0 6px rgba(255, 123, 0, .5));
        }

        @keyframes fall {

            0% {
                transform:
                    translateY(-60px)
                    rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: .75;
            }

            50% {
                opacity: .65;
            }

            90% {
                opacity: .5;
            }

            100% {
                transform:
                    translateY(110vh)
                    rotate(360deg);
                opacity: 0;
            }
        }

        /* =========================
           KONTEN UTAMA
        ========================= */

        .container {
            width: 90%;
            max-width: 700px;
            position: relative;
            z-index: 2;
        }

        .fox {
            font-size: 80px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px #ff7b00);
        }

        h1 {
            font-size: clamp(45px, 10vw, 85px);
            color: #ff7b00;
            letter-spacing: 8px;
            text-shadow: 0 0 15px #ff7b00;
        }

        .subtitle {
            margin-top: 10px;
            color: #ddd;
            font-size: 16px;
        }

        /* =========================
           TOMBOL MULAI
        ========================= */

        .start-btn {
            display: inline-block;
            margin-top: 40px;
            padding: 15px 45px;
            border: 2px solid #ff7b00;
            color: #ff7b00;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 3px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255,123,0,.3);
            background: rgba(0,0,0,.25);
        }

        .start-btn:hover {
            background: #ff7b00;
            color: #000;
            box-shadow: 0 0 25px #ff7b00;
        }

        /* =========================
           SYMBOL BAWAH
        ========================= */

        .symbols {
            margin-top: 35px;
            color: #ff7b00;
            letter-spacing: 18px;
            font-size: 22px;
            opacity: .8;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .fox {
                font-size: 65px;
            }

            h1 {
                letter-spacing: 5px;
            }

            .subtitle {
                font-size: 14px;
            }

            .start-btn {
                padding: 14px 38px;
            }

            .symbols {
                letter-spacing: 10px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="fox">🦊</div>

        <h1>MINI GAME</h1>

        <p class="subtitle">
            ya itulah pokok nya
        </p>

        <a href="gamehub.html" class="start-btn">
            MULAI
        </a>

        <div class="symbols">
            &lt; &gt; [ ] { } + *
        </div>

    </div>


    <!-- =========================
         EMOT JATUH
    ========================= -->

    <script>

        const fallingSymbols = [
            "🦊",
            "⚡",
            "🎮",
            "🔥",
            "💻",
            "◆",
            "✦",
            "+",
            "*"
        ];

        function createFallingSymbol() {

            const symbol = document.createElement("div");

            symbol.className = "falling-symbol";

            symbol.textContent =
                fallingSymbols[
                    Math.floor(
                        Math.random() * fallingSymbols.length
                    )
                ];

            symbol.style.left =
                Math.random() * 100 + "vw";

            symbol.style.fontSize =
                (14 + Math.random() * 18) + "px";

            symbol.style.animationDuration =
                (5 + Math.random() * 5) + "s";

            document.body.appendChild(symbol);

            setTimeout(() => {
                symbol.remove();
            }, 11000);
        }

        /* Emot baru muncul setiap 700ms */
        setInterval(createFallingSymbol, 700);

    </script>

</body>
</html>
