
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOX ADVENTURE</title>

<style>
:root {
  --cream: #fff0c8;
  --gold: #e7c77d;
  --green: #17351f;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: system-ui, Segoe UI, sans-serif;
  color: #fff;
  background: #14251a;
}

body {
  min-height: 100vh;
  overflow: hidden;
  background: linear-gradient(145deg, #244d2c, #102319 70%);
}

button {
  font: 800 14px system-ui;
  letter-spacing: .4px;
  color: #fff;
  background: linear-gradient(#3d7540, #234a2b);
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 13px 17px;
  box-shadow: 0 5px 0 #0b1b10;
  cursor: pointer;
  width: 100%;
  transition: transform .15s, filter .15s;
}

button:hover {
  filter: brightness(1.15);
}

button:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #0b1b10;
}

/* LOADING SCREEN */
#loading {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  text-align: center;
  background: radial-gradient(ellipse at center, #386a3b, #10251a 75%);
  transition: opacity .6s;
}

#welcome {
  font-size: clamp(22px, 5vw, 36px);
  line-height: 1.15;
  margin: 0;
  color: var(--cream);
  letter-spacing: 1.5px;
  text-shadow: 0 4px #55371d;
}

#logo {
  width: 144px;
  height: 120px;
  image-rendering: pixelated;
  filter: drop-shadow(0 0 14px #ffdf8c66);
}

#track {
  width: min(300px, 75vw);
  height: 17px;
  border: 2px solid var(--gold);
  padding: 2px;
  border-radius: 20px;
  background: #0b1d11;
  overflow: hidden;
}

#bar {
  height: 100%;
  width: 0;
  border-radius: 20px;
  background: linear-gradient(90deg, #86c96e, #fff0b7);
  box-shadow: 0 0 10px #d9f4a5;
  animation: fill 3.4s ease-in-out forwards;
}

#loadText {
  font-size: 12px;
  color: #f7eac9;
  opacity: .85;
  margin: 0;
}

@keyframes fill {
  0% { width: 0; }
  25% { width: 24%; }
  60% { width: 67%; }
  85% { width: 88%; }
  100% { width: 100%; }
}

/* HALAMAN UTAMA DAN BACKGROUND BARU */
#home {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity .7s;

  background:
    linear-gradient(#07130c66, #07130c66),
    url('./foxadventure.jpg') center / cover no-repeat;
}

#content {
  width: min(430px, 100%);
  margin-top: 8vh;
  text-align: center;
}

#title {
  font-size: clamp(32px, 8vw, 49px);
  line-height: 1.05;
  margin: 0;
  color: #fff0bd;
  letter-spacing: 2px;
  text-shadow: 0 4px 0 #59391e, 0 8px 18px #0009;
}

#chapter {
  margin: 10px 0 22px;
  color: #f6e4b1;
  font-weight: 700;
  text-shadow: 0 2px 5px #000;
}

#menu {
  padding: 23px 20px 20px;
  background: linear-gradient(145deg, #173b26ed, #0d2419ed);
  border: 2px solid #dfc17b;
  border-radius: 18px;
  box-shadow: 0 16px 50px #0008;
  display: grid;
  gap: 12px;
}

#saveInfo {
  margin: 0 0 3px;
  font-size: 12px;
  color: #e6e3ce;
}

#hub {
  margin-top: 16px;
  width: auto;
  min-width: 210px;
  background: #202e25dd;
  border-color: #c4c9b8;
  font-size: 12px;
  padding: 10px 14px;
}

@media (min-width: 700px) {
  #content {
    margin-top: 7vh;
  }
}
</style>
</head>

<body>

<audio id="foxMusic" src="foxmusic.mp3" loop preload="auto"></audio>

<!-- LOADING SCREEN -->
<div id="loading" aria-live="polite">
  <canvas id="logo" width="144" height="120"></canvas>

  <h1 id="welcome">
    WELCOME TO<br>
    FOXXY ADVENTURE
  </h1>

  <div id="track">
    <div id="bar"></div>
  </div>

  <p id="loadText">Menyiapkan petualangan Foxxy...</p>
</div>

<!-- HALAMAN UTAMA -->
<main id="home" aria-label="Beranda FOX ADVENTURE">
  <div id="content">

    <h1 id="title">FOX<br>ADVENTURE</h1>

    <p id="chapter">CHAPTER 1 · LABIRIN TERLUPAKAN</p>

    <section id="menu">
      <p id="saveInfo">Memeriksa save petualangan...</p>

      <button id="continue">
        LANJUTKAN PETUALANGAN
      </button>

      <button id="new">
        PETUALANGAN BARU
      </button>
    </section>

    <button
      id="hub"
      onclick="document.getElementById('foxMusic').pause();location.href='gamehub.html'"
    >
      ← KEMBALI KE GAME HUB
    </button>

  </div>
</main>

<script>
// LOGO FOXXY DIBUAT DENGAN PIXEL ART
const c = document.getElementById('logo').getContext('2d');
c.imageSmoothingEnabled = false;

function rect(x, y, w, h, color) {
  c.fillStyle = color;
  c.fillRect(x, y, w, h);
}

// Ekor, badan, kepala dan telinga
rect(39, 59, 12, 21, '#d96720');
rect(31, 72, 13, 10, '#f5a34c');
rect(49, 47, 39, 43, '#e87524');
rect(55, 57, 25, 25, '#f5e2bd');
rect(48, 25, 14, 27, '#e87524');
rect(75, 25, 14, 27, '#e87524');
rect(51, 29, 7, 13, '#f6b15b');
rect(78, 29, 7, 13, '#f6b15b');
rect(52, 44, 12, 11, '#fff');
rect(72, 44, 12, 11, '#fff');
rect(56, 47, 5, 6, '#20251e');
rect(75, 47, 5, 6, '#20251e');
rect(63, 58, 8, 5, '#8b3e1b');
rect(54, 86, 11, 10, '#8b3e1b');
rect(74, 86, 11, 10, '#8b3e1b');

// MUSIK FOX ADVENTURE
const foxMusic = document.getElementById('foxMusic');

function startFoxMusic() {
  foxMusic.play().catch(() => {});
}

document.addEventListener('pointerdown', startFoxMusic, {
  once: true
});

// SISTEM SAVE
const key = 'foxAdventureSave_v1';

function save() {
  try {
    return JSON.parse(localStorage.getItem(key) || 'null');
  } catch (e) {
    return null;
  }
}

function update() {
  const s = save();

  document.getElementById('saveInfo').textContent = s
    ? 'Save ditemukan · progres terakhir siap dilanjutkan.'
    : 'Belum ada save. Mulai petualangan pertamamu!';

  document.getElementById('continue').textContent = s
    ? 'LANJUTKAN PETUALANGAN'
    : 'MULAI PETUALANGAN';
}

// LANJUTKAN PETUALANGAN
document.getElementById('continue').onclick = () => {
  startFoxMusic();
  location.href = 'foxgame.html?mode=continue';
};

// PETUALANGAN BARU
document.getElementById('new').onclick = () => {
  if (
    save() &&
    !confirm('Mulai petualangan baru? Save lama akan diganti.')
  ) {
    return;
  }

  startFoxMusic();
  location.href = 'foxgame.html?mode=new';
};

// PERBARUI MENU DAN SELESAIKAN LOADING
update();

const loading = document.getElementById('loading');
const home = document.getElementById('home');

setTimeout(() => {
  loading.style.opacity = '0';

  setTimeout(() => {
    loading.style.display = 'none';
    home.style.opacity = '1';
  }, 620);

}, 3500);
</script>

</body>
</html>
