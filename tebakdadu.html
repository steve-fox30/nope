<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEBAK DADU | MINI GAME</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(255,140,0,.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,140,0,.04) 1px,transparent 1px);
    background-size:30px 30px;
    pointer-events:none;
}

/* GAME BOX */

.game-container{
    width:90%;
    max-width:430px;
    min-height:600px;
    border:1px solid #ff8c00;
    box-shadow:
        0 0 20px rgba(255,140,0,.15),
        inset 0 0 25px rgba(255,140,0,.03);

    padding:25px 20px;
    text-align:center;

    display:flex;
    flex-direction:column;
    align-items:center;

    position:relative;
}

/* HEADER */

.title{
    color:#ff8c00;
    font-size:26px;
    letter-spacing:4px;
    margin-bottom:5px;
}

.subtitle{
    color:#777;
    font-size:12px;
    letter-spacing:2px;
}

/* SCORE */

.score-box{
    margin-top:20px;
    font-size:14px;
    color:#aaa;
}

#score{
    color:#ff8c00;
    font-size:24px;
    font-weight:bold;
}

/* DICE AREA */

.dice-area{
    width:180px;
    height:180px;

    margin-top:35px;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* DICE */

.dice{
    width:120px;
    height:120px;

    background:#111;

    border:2px solid #ff8c00;

    border-radius:18px;

    display:grid;

    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);

    padding:14px;

    box-shadow:
        0 0 20px rgba(255,140,0,.25);
}

/* DOT */

.dot{
    width:17px;
    height:17px;

    background:#ff8c00;

    border-radius:50%;

    align-self:center;
    justify-self:center;

    opacity:0;
}

/* POSITIONS */

.p1{grid-area:1/1;}
.p2{grid-area:1/2;}
.p3{grid-area:1/3;}
.p4{grid-area:2/1;}
.p5{grid-area:2/2;}
.p6{grid-area:2/3;}
.p7{grid-area:3/1;}
.p8{grid-area:3/2;}
.p9{grid-area:3/3;}

/* DICE ROLL */

.rolling{
    animation:roll .18s infinite linear;
}

@keyframes roll{

    0%{
        transform:rotate(0deg) scale(1);
    }

    50%{
        transform:rotate(180deg) scale(.9);
    }

    100%{
        transform:rotate(360deg) scale(1);
    }

}

/* COVER */

.cover{
    position:absolute;

    width:120px;
    height:120px;

    background:#090909;

    border:2px solid #ff8c00;

    border-radius:18px;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#ff8c00;

    font-size:45px;
    font-weight:bold;

    opacity:0;
    visibility:hidden;

    z-index:5;

    transition:opacity .15s ease;
}

.cover.show{
    opacity:1;
    visibility:visible;
}

/* STATUS */

.status{
    margin-top:20px;

    height:25px;

    color:#888;

    font-size:13px;
}

/* GUESS */

.guess-area{
    margin-top:15px;

    width:100%;

    opacity:.4;

    pointer-events:none;

    transition:.2s;
}

.guess-area.active{
    opacity:1;
    pointer-events:auto;
}

.guess-title{
    color:#aaa;
    font-size:13px;
    margin-bottom:12px;
}

/* NUMBER BUTTONS */

.number-buttons{
    display:grid;

    grid-template-columns:repeat(6,1fr);

    gap:7px;

    max-width:350px;

    margin:auto;
}

.number-btn{
    height:45px;

    background:#0b0b0b;

    color:#ff8c00;

    border:1px solid #ff8c00;

    cursor:pointer;

    font-weight:bold;

    transition:.15s;
}

.number-btn:hover{
    background:#ff8c00;
    color:#000;
}

.number-btn.selected{
    background:#ff8c00;
    color:#000;

    box-shadow:0 0 12px rgba(255,140,0,.4);
}

/* GUESS BUTTON */

.guess-btn{
    margin-top:15px;

    width:100%;
    max-width:350px;

    height:48px;

    background:#ff8c00;

    color:#000;

    border:none;

    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

    transition:.15s;
}

.guess-btn:hover{
    box-shadow:0 0 15px rgba(255,140,0,.5);
}

.guess-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* ROLL AGAIN */

.roll-btn{
    margin-top:12px;

    background:transparent;

    color:#ff8c00;

    border:1px solid #ff8c00;

    padding:10px 20px;

    cursor:pointer;

    display:none;
}

/* RESULT */

.result{
    margin-top:12px;

    min-height:22px;

    font-size:14px;

    font-weight:bold;
}

.correct{
    color:#00ff88;
}

.wrong{
    color:#ff4444;
}

/* HOME */

.home-btn{
    margin-top:auto;

    padding-top:25px;

    color:#666;

    text-decoration:none;

    font-size:13px;

    letter-spacing:1px;
}

.home-btn:hover{
    color:#ff8c00;
}

/* MOBILE */

@media(max-width:400px){

    .game-container{
        min-height:580px;
    }

    .dice-area{
        margin-top:25px;
    }

    .number-btn{
        height:40px;
    }

}

</style>
</head>

<body>

<div class="game-container">

    <div class="title">
        TEBAK DADU
    </div>

    <div class="subtitle">
        &lt; GUESS THE HIDDEN NUMBER &gt;
    </div>


    <div class="score-box">
        SKOR
        <div id="score">0</div>
    </div>


    <!-- DICE -->

    <div class="dice-area">

        <div class="dice" id="dice">

            <span class="dot p1"></span>
            <span class="dot p2"></span>
            <span class="dot p3"></span>

            <span class="dot p4"></span>
            <span class="dot p5"></span>
            <span class="dot p6"></span>

            <span class="dot p7"></span>
            <span class="dot p8"></span>
            <span class="dot p9"></span>

        </div>


        <!-- COVER -->

        <div class="cover" id="cover">
            ?
        </div>

    </div>


    <div class="status" id="status">
        DADU SIAP...
    </div>


    <!-- GUESS -->

    <div class="guess-area" id="guessArea">

        <div class="guess-title">
            PILIH ANGKA
        </div>


        <div class="number-buttons">

            <button class="number-btn" data-number="1">1</button>
            <button class="number-btn" data-number="2">2</button>
            <button class="number-btn" data-number="3">3</button>
            <button class="number-btn" data-number="4">4</button>
            <button class="number-btn" data-number="5">5</button>
            <button class="number-btn" data-number="6">6</button>

        </div>


        <button class="guess-btn" id="guessBtn" disabled>
            TEBAK
        </button>

    </div>


    <div class="result" id="result"></div>


    <button class="roll-btn" id="rollAgain">
        🎲 ROLL LAGI
    </button>


    <a href="gamehub.html" class="home-btn" id="homeBtn">
        ← BERANDA
    </a>

</div>


<script>

/* =========================
   VARIABLES
========================= */

const dice = document.getElementById("dice");
const cover = document.getElementById("cover");

const statusText = document.getElementById("status");

const guessArea = document.getElementById("guessArea");

const guessBtn = document.getElementById("guessBtn");

const resultText = document.getElementById("result");

const rollAgain = document.getElementById("rollAgain");

const scoreDisplay = document.getElementById("score");

const numberButtons =
    document.querySelectorAll(".number-btn");


let score =
    Number(localStorage.getItem("daduScore")) || 0;

let diceResult = 1;

let selectedNumber = null;

let rolling = false;


/* =========================
   DICE FACES
========================= */

const faces = {

    1:[5],

    2:[1,9],

    3:[1,5,9],

    4:[1,3,7,9],

    5:[1,3,5,7,9],

    6:[1,3,4,6,7,9]

};


/* =========================
   SHOW DICE
========================= */

function showDice(number){

    const dots =
        document.querySelectorAll(".dot");

    dots.forEach((dot,index)=>{

        const position = index + 1;

        if(faces[number].includes(position)){

            dot.style.opacity = "1";

        }else{

            dot.style.opacity = "0";

        }

    });

}


/* =========================
   SCORE
========================= */

function updateScore(){

    scoreDisplay.textContent = score;

    localStorage.setItem(
        "daduScore",
        score
    );

}


/* =========================
   RESET GUESS
========================= */

function resetGuess(){

    selectedNumber = null;

    numberButtons.forEach(btn=>{
        btn.classList.remove("selected");
    });

    guessBtn.disabled = true;

}


/* =========================
   ROLL DICE
========================= */

function rollDice(){

    if(rolling) return;

    rolling = true;

    guessArea.classList.remove("active");

    resultText.textContent = "";

    resultText.className = "result";

    rollAgain.style.display = "none";

    resetGuess();

    /* HIDE COVER */

    cover.classList.remove("show");


    /* RANDOM FINAL RESULT */

    diceResult =
        Math.floor(Math.random()*6)+1;


    /* START ANIMATION */

    dice.classList.add("rolling");

    statusText.textContent =
        "DADING MUTER...";


    /*
       1 DETIK
       COVER MENUTUP DADU
    */

    setTimeout(()=>{

        cover.classList.add("show");

        statusText.textContent =
            "HASIL TERSEMBUNYI...";

    },1000);


    /*
       2 DETIK
       DADU BERHENTI
    */

    setTimeout(()=>{

        dice.classList.remove("rolling");

        /*
           HASIL TETAP DISET,
           TAPI TERTUTUP COVER
        */

        showDice(diceResult);

        statusText.textContent =
            "PILIH ANGKA DAN TEBAK";

        guessArea.classList.add("active");

        rolling = false;

    },2000);

}


/* =========================
   NUMBER SELECT
========================= */

numberButtons.forEach(btn=>{

    btn.addEventListener("click",()=>{

        if(rolling) return;

        selectedNumber =
            Number(btn.dataset.number);


        numberButtons.forEach(b=>{
            b.classList.remove("selected");
        });


        btn.classList.add("selected");

        guessBtn.disabled = false;

    });

});


/* =========================
   GUESS
========================= */

guessBtn.addEventListener("click",()=>{

    if(
        selectedNumber === null ||
        rolling
    ) return;


    if(selectedNumber === diceResult){

        score += 10;

        resultText.textContent =
            "✓ BENAR! +10";

        resultText.className =
            "result correct";

    }else{

        score -= 2;

        resultText.textContent =
            "✕ SALAH! -2";

        resultText.className =
            "result wrong";

    }


    updateScore();

    guessArea.classList.remove("active");

    guessBtn.disabled = true;

    rollAgain.style.display =
        "inline-block";

});


/* =========================
   ROLL AGAIN
========================= */

rollAgain.addEventListener(
    "click",
    rollDice
);


/* =========================
   HOME
========================= */

document
.getElementById("homeBtn")
.addEventListener("click",()=>{

    updateScore();

});


/* =========================
   START
========================= */

updateScore();

showDice(1);

setTimeout(()=>{
    rollDice();
},500);

</script>

</body>
</html>
